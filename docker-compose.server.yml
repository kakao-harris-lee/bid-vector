services:
  api:
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://bidvector:bidvector@rabbitmq:5672/bidvector}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-db+postgresql+psycopg://biduser:bidpassword@db:5432/bid_vector_db}
    volumes: []
    # Apply DB migrations before serving so schema is the single source of truth
    # (alembic). See app/main.py lifespan note and tests/test_schema_drift.py.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT:-3000} --workers ${API_WORKERS:-2}"

  rabbitmq:
    profiles: []

  worker:
    profiles: []
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://bidvector:bidvector@rabbitmq:5672/bidvector}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-db+postgresql+psycopg://biduser:bidpassword@db:5432/bid_vector_db}
    volumes: []

  ml-worker:
    profiles: []
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://bidvector:bidvector@rabbitmq:5672/bidvector}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-db+postgresql+psycopg://biduser:bidpassword@db:5432/bid_vector_db}
    volumes: []

  training-worker:
    profiles: []
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://bidvector:bidvector@rabbitmq:5672/bidvector}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-db+postgresql+psycopg://biduser:bidpassword@db:5432/bid_vector_db}
    volumes: []

  beat:
    profiles: []
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://bidvector:bidvector@rabbitmq:5672/bidvector}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-db+postgresql+psycopg://biduser:bidpassword@db:5432/bid_vector_db}
    volumes:
      - celery_beat_data:/tmp
