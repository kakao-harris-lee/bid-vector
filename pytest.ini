[pytest]
testpaths = tests
# 미등록 마커를 오류로 만든다. 마커 이름에 오타가 나면 `-m postgres` 잡은 그 테스트를
# 선택하지 못하고 기본 잡은 deselect 하지도 않아, 양쪽이 아무것도 검증하지 않은 채
# 조용히 초록이 된다.
addopts = --strict-markers
markers =
    postgres: runs against a real PostgreSQL+pgvector instance (skipped unless TEST_POSTGRES_URL is set; never point it at the compose `db` service)
