# Project tooling config (Phase 0: typecheck + CI foundation).
#
# This file intentionally carries ONLY static-analysis configuration. It changes
# no application behaviour. See docs/design/typecheck-ci-improvement.md for the
# initiative goals, the mypy "island ratchet" plan, and the over-engineering
# guardrails (no global Money rewrite).

# ---------------------------------------------------------------------------
# mypy — gradual typing via the "island" model
# ---------------------------------------------------------------------------
# The current app/ tree is 147 largely-untyped files built on old-style
# SQLAlchemy `Column(...)` models that declarative_base() cannot expose as their
# runtime types. Running mypy over it produces ~686 findings that are almost all
# the well-known `Column[str]`-vs-`str` false positives, not real bugs.
#
# Rather than rewrite legacy annotations now (out of scope, behaviour-risk), we:
#   1. keep the global profile lenient (NO strict flags here), and
#   2. grandfather the whole app.* tree with ignore_errors below, so `mypy app/`
#      is green today, and
#   3. ratchet forward by flipping ONE module at a time to strict via an
#      exact-name override (see the commented island example at the bottom).
#
# Exact module names beat the `app.*` wildcard regardless of section order, so a
# strict island is fully checked while the rest of app.* stays grandfathered.
[tool.mypy]
python_version = "3.12"
# Third-party packages without type stubs (sqlalchemy old-style, celery,
# python-telegram-bot, boto3, ...) must not fail the run.
ignore_missing_imports = true
# Follow imports for name resolution but don't surface errors from imported
# (grandfathered) modules.
follow_imports = "silent"
warn_unused_configs = true

# --- Legacy grandfather: keep the current untyped tree green ----------------
[[tool.mypy.overrides]]
module = ["app", "app.*"]
ignore_errors = true

# --- Ratchet islands (Phase 1+) --------------------------------------------
# To bring a NEW module under strict typing, add an exact-name override like the
# example below. Because exact names win over the `app.*` wildcard above, only
# that module is checked; the rest of the tree remains grandfathered. Do NOT add
# legacy modules here without first typing them — that reintroduces the ~686
# false positives.
#
# Phase 1a — first strict islands. Exact names win over the app.* wildcard above,
# so ONLY these modules are strictly checked; the rest stays grandfathered.
# Phase 1b adds app.domain.reliable_base (basis-aware 기초금액 선택 — #199 태그 소비자).
# Phase 1c adds app.domain.rate_normalization (투찰율 percent↔fraction 스케일 규칙 단일 출처).
# Phase 1d adds app.domain.aggregates (절대 오차율·산술평균 집계 원시 연산 단일 출처).
# These pure-domain modules import no untyped third-party deps, so they get the
# strict flags with NO error-code relaxation.
[[tool.mypy.overrides]]
module = [
    "app.domain.money",
    "app.domain.basis_conversion",
    "app.domain.reliable_base",
    "app.domain.rate_normalization",
    "app.domain.aggregates",
]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# Phase 2a — app.services.koneps.http_client (KONEPS transport + resultCode
# envelope validation: the single ``check_result_code`` helper consolidating 4
# copy-paste sites; the whole module is strict-green). Kept in its own block so
# the ``import-untyped`` relaxation below is scoped to it and does NOT weaken the
# pure-domain island above. ``requests`` ships no stubs, so importing it must not
# fail a strict island — the same policy as the global ``ignore_missing_imports``,
# which silences module-not-found but not the ``import-untyped`` code.
[[tool.mypy.overrides]]
module = ["app.services.koneps.http_client"]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
disable_error_code = ["import-untyped"]

# Phase 2c — app.services.koneps.field_contract (KONEPS 필드 계약 선언 + 순수 검증기:
# 신규 수집 필드를 소비 전에 실 응답으로 assert 하는 게이트의 순수 코어). 무거운 deps 를
# 끌지 않도록 app.domain.money.Basis(순수 strict 아일랜드)만 재사용하는 자립 순수 모듈이라
# error-code 완화 없이 strict 로 올린다. field_contract_observer 는 그 순수 검증기를 라이브
# 수집 경로에 관찰 전용으로 배선하는 run-단위 집계기(순수 카운터, IO 없음)라 같은 아일랜드.
# field_contract_spec 은 같은 아일랜드에서 갈라져 나온 **선언 절반**(어휘 enum · 계열 분류표 ·
# 함정 필드 계약 · 기지 필드)이다: 파일 크기 한도(§4.5-4) 때문에 데이터/검증을 나눴을 뿐
# 의존 형태는 동일(순수 + Basis 만)하므로 아일랜드 강도를 그대로 유지한다.
[[tool.mypy.overrides]]
module = [
    "app.services.koneps.field_contract",
    "app.services.koneps.field_contract_observer",
    "app.services.koneps.field_contract_spec",
]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# Phase 2e — app.services.notifications.fatigue (텔레그램 결정 알림 피로도 게이트의 순수
# 코어: 일일 상한·재알림 쿨다운 판정). limits/signals/now 를 인자로만 받고 DB·시계·settings
# 를 직접 부르지 않는 자립 순수 모듈이라 error-code 완화 없이 strict 로 올린다. I/O 절반
# (fatigue_gate) 은 SQLAlchemy 세션을 잡으므로 아일랜드에 넣지 않는다.
[[tool.mypy.overrides]]
module = ["app.services.notifications.fatigue"]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# Phase 2d — app.services.bid_base (예측 입력 조합 헬퍼: 공고에서 도출한 base/text/
# published floor/tier 입력을 한 곳에서 묶는 DB 경계). budget_estimate(추정가격 ex-VAT)와
# base_amount(기초금액 VAT 포함)가 float 레벨에서 자유 대입되던 것을 money.BaseAmount 로
# 시그니처에 강제해 #162 류 basis 혼동을 정적으로 잡는다. sqlalchemy 2.0 은 py.typed 를
# 실어 transport 가 이미 typed 라 error-code 완화가 필요 없다(순수 domain 아일랜드와 달리
# DB 세션을 잡지만, 모델 접근은 대부분 getattr → Any 라 strict-green).
[[tool.mypy.overrides]]
module = ["app.services.bid_base"]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# Phase 3a — pure classification / settlement kernels. Like the Phase 1 domain
# block above, these import only stdlib (dataclasses / enum / datetime / json) or
# an existing strict island, so they get the strict flags with NO error-code
# relaxation. Each is a self-contained pure module (no DB / IO / network):
#   * app.services.classification.assessment — 단일 축 판정 결과 계약(RuleAssessment
#     dataclass). 모든 rule-based 축 모듈이 공유하는 값 타입.
#   * app.services.classification.group_or — lmtGrpNo 그룹-OR / 그룹내-AND 자격 평가
#     커널(집합 대수만 수행, #254 축 정합의 단일 출처).
#   * app.services.classification.config — 선언적 스코어링 상수·밴드 테이블(§4.5
#     매직값 중앙화). 함수 없는 데이터 모듈이라 어노테이션 없이 strict-green.
#   * app.services.paper_bidding_settlement — 정산 상태 first-match 룰 테이블 FSM
#     (라우터에서 분리한 순수 판정기).
#   * app.services.base_amount_basis — base_amount provenance 분류기(#199 태그 생산
#     순수 코어). 유일한 앱 import 는 app.domain.rate_normalization(strict 아일랜드).
[[tool.mypy.overrides]]
module = [
    "app.services.classification.assessment",
    "app.services.classification.group_or",
    "app.services.classification.config",
    "app.services.paper_bidding_settlement",
    "app.services.base_amount_basis",
]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# Phase 3b — app.services.query_predicates (공유 읽기-쿼리 술어 빌더: 서비스·스크립트에
# 흩어져 있던 필터 조건을 ``ColumnElement[bool]`` 헬퍼로 단일화한 순수 SQLAlchemy 모듈).
# bid_base(Phase 2d)와 동일하게 sqlalchemy 2.0 은 py.typed 를 실어 transport 가 이미
# typed 라 ``import-untyped`` 완화가 필요 없다. 모델 컬럼 접근은 typed InstrumentedAttribute
# 라 ``in_``/``and_``/``or_`` 가 ``ColumnElement[bool]`` 로 좁혀져 warn_return_any 도 통과.
[[tool.mypy.overrides]]
module = ["app.services.query_predicates"]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# Phase 3c — app.services.opportunity_monitoring.preview_cache (전략 후보 미리보기의
# single-flight + 단기 TTL 캐시). threading/time/copy/dataclasses 만 쓰는 자립 모듈이라
# error-code 완화 없이 strict 로 올린다. 시계(``now``)는 인자로 주입받아 순수 계약을 유지
# 한다(§4.7 주입).
[[tool.mypy.overrides]]
module = ["app.services.opportunity_monitoring.preview_cache"]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# Phase 3d — app.schemas._base (신규 DTO 의 방어적 베이스: ``extra="forbid"`` 단일 출처).
# pydantic 은 py.typed 를 실어 transport 가 이미 typed 이고, 이 모듈은 config-only 모델
# 선언 둘뿐이라 error-code 완화 없이 strict 로 올린다. 신규 DTO 가 이 베이스를 상속하며
# 늘어날 표면이라 처음부터 strict 아일랜드로 둔다(설계 래칫과 같은 방향의 래칫).
[[tool.mypy.overrides]]
module = ["app.schemas._base"]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# Phase 3e — KONEPS 수집 DTO 체인(방어적 DTO Phase 3)의 **ORM 비접촉** 절반. 원시 dict
# 릴레이를 ``KonepsCollectedItem``/``CrawlItemMetadataFacts``/``ScsbidReserveDetail`` 로
# 바꾼 경로에 정적 검사를 붙여, 다음 변경이 조용히 ``Any``/``dict`` 로 되돌아가는(강등 재발)
# 것을 막는다. ``bs4``(html_parsing) 는 스텁을 싣지 않으므로 ``import-untyped`` 만 완화한다
# — 전역 ``ignore_missing_imports`` 와 같은 정책이며 아일랜드 내부 강도는 유지된다.
#
# 같은 체인의 ``persistence``(51) / ``matching``(10) / ``scsbid``(1) 는 **의도적으로 제외**
# 한다: 그 셋은 old-style ``Column(...)`` 모델 속성을 읽고 대입하므로 위 grandfather 블록이
# 존재하는 이유인 ``Column[str]``-vs-``str`` 오탐이 전부 되살아난다(실측 62건, 정확성 결함
# 0건). 올리려면 모델을 ``Mapped[...]`` 로 옮기는 선행 작업이 필요하고, 그 없이 넣으면
# ``assignment``/``arg-type``/``list-item``/``return-value`` 를 통째로 완화해야 해서 아일랜드
# 의 의미가 사라진다(이 파일 상단 규칙: "Do NOT add legacy modules here without first typing
# them"). 후속 트랙에서 모델 타입화와 함께 승격한다.
#
# ``openapi_operations`` 는 ``openapi`` 에서 갈라져 나온 선언 테이블 절반(함수 없음, 순수
# 상수)이라 같은 아일랜드로 둔다 — 다음 변경이 표를 코드 분기로 되돌리는 것을 막는다.
[[tool.mypy.overrides]]
module = [
    "app.schemas.koneps_items",
    "app.services.koneps.collection",
    "app.services.koneps.html_parsing",
    "app.services.koneps.openapi",
    "app.services.koneps.openapi_operations",
]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
disable_error_code = ["import-untyped"]

# Phase 4b — ``Analytics.event_data`` 계약 체인(방어적 DTO Phase 4.2): 직렬화/복원 단일
# 경로(analytics_event_payload), Telegram 배달 경로 판정 코어(telegram_delivery_plan),
# 그리고 피로도 게이트의 I/O 절반(fatigue_gate). 앞의 둘은 DB 를 만지지 않는 순수 모듈이고,
# fatigue_gate 는 세션을 잡지만 ORM 속성을 **판정에 대입하지 않고** 복원 모델로만 읽어
# ``Column[str]``-vs-``str`` 오탐이 발생하지 않는다(실측 0건). 셋 다 error-code 완화 없이
# strict 로 올린다 — 다음 변경이 조용히 ``dict``/``Any`` 로 되돌아가는 것을 막는 정적 가드다.
#
# 제외한 것과 그 이유:
#   * ``app.schemas.analytics_events`` — ``Persisted*`` 복원 모델이 생산 모델을 상속해
#     필드를 ``X | None`` 으로 넓힌다(미기록을 ``null`` 로 보존하는 P1 패턴). 이 넓히기는
#     의도된 계약이지만 mypy 에는 LSP 위반(``assignment``)이라, 올리려면 그 코드를 통째로
#     완화해야 해서 아일랜드의 의미가 사라진다. ``app.schemas.paper_bidding_runs`` 를
#     제외한 것과 같은 이유다.
#   * ``notifications.manager`` / ``notifications.telegram_strategy_pending`` — ORM 행
#     속성을 읽고 **대입**해 grandfather 블록이 존재하는 이유인 ``Column[str]``-vs-``str``
#     오탐이 되살아난다. 모델을 ``Mapped[...]`` 로 옮기는 선행 작업 없이 넣으면
#     ``arg-type``/``assignment`` 을 통째로 완화해야 한다(이 파일 상단 규칙).
[[tool.mypy.overrides]]
module = [
    "app.services.analytics_event_payload",
    "app.services.notifications.fatigue_gate",
    "app.services.notifications.telegram_delivery_plan",
]
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# ---------------------------------------------------------------------------
# ruff — lint (real errors, not style churn)
# ---------------------------------------------------------------------------
[tool.ruff]
# 88 is the black/PEP-8-adjacent convention already used across the tree.
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Mirror ruff's sensible default set: pyflakes (F) + the correctness slice of
# pycodestyle (E4/E7/E9). E501 (line-too-long) is intentionally NOT enforced:
# the tree has ~1.8k lines over 88 chars and this PR does zero reformatting
# (config-only). line-length above still governs the formatter and any future
# E501 opt-in. Widen this set module-by-module as the code is cleaned up.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Grandfathered pre-existing findings so CI is green without touching app logic
# (config-only PR). Each entry is a known legacy issue to clean up in a later
# pass; see docs/design/typecheck-ci-improvement.md. Remove the entry when fixed.
"app/ai/bid_recommendation.py" = ["F841"]        # dead local `user_avg_bid` (ml-owned file)
"app/api/admin.py" = ["F401"]                    # unused import: models.User
"app/api/analytics.py" = ["F401"]                # unused import: models.BidDecisionRecord
"app/services/allocation.py" = ["F821"]          # false positive: quoted forward-ref, name is lazily imported in-body
"app/services/project_similarity.py" = ["E741"]  # ambiguous one-letter var `l`
