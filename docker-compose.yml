services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bid_vector_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-bid_vector_db}
      POSTGRES_USER: ${DATABASE_USER:-biduser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-bidpassword}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-biduser} -d ${DATABASE_NAME:-bid_vector_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.12.14-management-alpine
    container_name: bid_vector_rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    profiles:
      - tasks
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_USER: ${CELERY_RABBITMQ_USER:-bidvector}
      RABBITMQ_DEFAULT_PASS: ${CELERY_RABBITMQ_PASSWORD:-bidvector}
      RABBITMQ_DEFAULT_VHOST: ${CELERY_RABBITMQ_VHOST:-bidvector}
    ports:
      - "${CELERY_RABBITMQ_PORT:-5672}:5672"
      - "${CELERY_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Builds the dashboard SPA (host source -> host frontend/dist) so the api can
  # serve it. Compose-managed: removes the manual `npm --prefix frontend run build`
  # step. Runs host code via the same `.:/app` bind mount as every other service,
  # so the served frontend always matches the current branch (CLAUDE.md §0).
  frontend-build:
    image: node:24-bookworm-slim
    container_name: bid_vector_frontend_build
    working_dir: /app/frontend
    restart: "no"
    volumes:
      - .:/app
      # Keep container node_modules isolated from the host's so a Linux/node:24
      # install never clobbers host-side tooling (vitest/build).
      - frontend_node_modules:/app/frontend/node_modules
    command: sh -c "npm ci --legacy-peer-deps && npm run build"

  api:
    build:
      context: .
      target: ${API_DOCKER_TARGET:-api-runtime}
    container_name: bid_vector_api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-bid_vector_db}
      DATABASE_USER: ${DATABASE_USER:-biduser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-bidpassword}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3000}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-memory://}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-cache+memory://}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      MODEL_CACHE_DIR: /app/models
      CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY: ${CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY:-true}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PYTHONPATH: /app
      # 스레드/아레나 선언적 튜닝 (설계 2026-07-30 §5 PR-A-4, S1): 스레드풀 x
      # torch/BLAS 가 glibc malloc 아레나를 스레드마다 비대화시키는 것을 상한.
      # 값 변경 반영은 restart 가 아니라 `docker compose up -d <service>` 재생성(§0).
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    shm_size: "1gb"
    # Inline-ML memory spikes must stay container-scoped: on 2026-07-29 the API grew
    # to 8.4GiB anon-rss and triggered a host-global OOM (collateral kills of host
    # daemons). Observed healthy peak is ~4GiB, so 8g caps runaway growth only.
    mem_limit: 8g
    volumes:
      - .:/app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${API_PORT:-3000}/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    # Apply DB migrations before serving so schema is the single source of truth
    # (alembic). See app/main.py lifespan note and tests/test_schema_drift.py.
    # No --reload: its reloader parent outlives an OOM-killed app child while still
    # holding the listen socket, so every request hangs with no auto-restart
    # (2026-07-29 incident, 17h outage). A crash now takes the container down
    # (uvicorn -> sh -> init exit) and restart: unless-stopped self-heals. Code
    # deploys therefore require `docker compose restart api` after checkout
    # (see CLAUDE.md §0).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT:-3000}"

  worker:
    build:
      context: .
      target: ${API_DOCKER_TARGET:-api-runtime}
    container_name: bid_vector_worker
    restart: unless-stopped
    init: true
    profiles:
      - tasks
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-bid_vector_db}
      DATABASE_USER: ${DATABASE_USER:-biduser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-bidpassword}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://bidvector:bidvector@rabbitmq:5672/bidvector}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-cache+memory://}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      MODEL_CACHE_DIR: /app/models
      CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY: ${CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY:-true}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PYTHONPATH: /app
      # 스레드/아레나 선언적 튜닝 (설계 2026-07-30 §5 PR-A-4, S1): 스레드풀 x
      # torch/BLAS 가 glibc malloc 아레나를 스레드마다 비대화시키는 것을 상한.
      # 값 변경 반영은 restart 가 아니라 `docker compose up -d <service>` 재생성(§0).
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
    shm_size: "1gb"
    # 운영 큐 워커 메모리 상한. ML inference 장시간 작업은 inference-worker 로
    # 분리하고, 이 컨테이너는 crawl/notification/reconcile 등 ops 작업을 처리한다.
    # 기존 상한은 보수적으로 유지해 worker_max_memory_per_child 와 이중 가드한다.
    # 값 변경 반영은 restart 가 아니라 `docker compose up -d worker` 재생성(§0).
    mem_limit: 10g
    volumes:
      - .:/app
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO --queues=${CELERY_OPS_QUEUE:-bid_vector_ops},${CELERY_TASK_DEFAULT_QUEUE:-bid_vector}

  inference-worker:
    build:
      context: .
      target: ${INFERENCE_WORKER_DOCKER_TARGET:-api-ml-full}
    container_name: bid_vector_inference_worker
    restart: unless-stopped
    init: true
    profiles:
      - tasks
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-bid_vector_db}
      DATABASE_USER: ${DATABASE_USER:-biduser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-bidpassword}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://bidvector:bidvector@rabbitmq:5672/bidvector}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-cache+memory://}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      MODEL_CACHE_DIR: /app/models
      CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY: ${CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY:-true}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PYTHONPATH: /app
      # 스레드/아레나 선언적 튜닝 (설계 2026-07-30 §5 PR-A-4, S1): 스레드풀 x
      # torch/BLAS 가 glibc malloc 아레나를 스레드마다 비대화시키는 것을 상한.
      # 값 변경 반영은 restart 가 아니라 `docker compose up -d <service>` 재생성(§0).
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
    shm_size: "1gb"
    # UX-triggered online inference 큐 워커 메모리 상한. preview snapshot 과
    # strategy monitor ML 스캔을 ops 큐에서 격리하며, 자식 리사이클러가 컨테이너
    # OOM 보다 먼저 동작하도록 ml-worker 와 같은 8g 를 둔다.
    # 반영은 `docker compose up -d inference-worker` 재생성(§0).
    mem_limit: 8g
    volumes:
      - .:/app
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO --queues=${CELERY_ML_INFERENCE_QUEUE:-bid_vector_ml_inference}

  ml-worker:
    build:
      context: .
      target: ${ML_WORKER_DOCKER_TARGET:-api-ml-full}
    container_name: bid_vector_ml_worker
    restart: unless-stopped
    init: true
    profiles:
      - tasks
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-bid_vector_db}
      DATABASE_USER: ${DATABASE_USER:-biduser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-bidpassword}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://bidvector:bidvector@rabbitmq:5672/bidvector}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-cache+memory://}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      MODEL_CACHE_DIR: /app/models
      CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY: ${CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY:-true}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PYTHONPATH: /app
      # 스레드/아레나 선언적 튜닝 (설계 2026-07-30 §5 PR-A-4, S1): 스레드풀 x
      # torch/BLAS 가 glibc malloc 아레나를 스레드마다 비대화시키는 것을 상한.
      # 값 변경 반영은 restart 가 아니라 `docker compose up -d <service>` 재생성(§0).
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
    shm_size: "1gb"
    # ML backfill/재평가 큐 워커 메모리 상한 (설계 2026-07-30 §6.4). #317 의
    # 컨테이너 스코프 격리 완성. 산술: worker_concurrency=2 x
    # worker_max_memory_per_child(자식 3GiB) = 6GiB + 부모/오버헤드 → 8g 로 둬야
    # 자식 리사이클러가 컨테이너 OOM 킬러보다 **먼저** 동작한다(6g 면 자식 2개가
    # 상한까지 차는 순간 여유가 0이라 OOM 킬러가 이긴다).
    # 반영은 `docker compose up -d ml-worker` 재생성(§0).
    mem_limit: 8g
    volumes:
      - .:/app
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO --queues=${CELERY_ML_BACKFILL_QUEUE:-bid_vector_ml_backfill},${CELERY_ML_REEVALUATION_QUEUE:-bid_vector_ml_reevaluation}

  training-worker:
    build:
      context: .
      target: ${TRAINING_WORKER_DOCKER_TARGET:-api-training}
    container_name: bid_vector_training_worker
    restart: unless-stopped
    init: true
    profiles:
      - tasks
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-bid_vector_db}
      DATABASE_USER: ${DATABASE_USER:-biduser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-bidpassword}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://bidvector:bidvector@rabbitmq:5672/bidvector}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-cache+memory://}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      MODEL_CACHE_DIR: /app/models
      CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY: ${CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY:-true}
      PYTHONPATH: /app
      # 스레드/아레나 선언적 튜닝 (설계 2026-07-30 §5 PR-A-4, S1): 스레드풀 x
      # torch/BLAS 가 glibc malloc 아레나를 스레드마다 비대화시키는 것을 상한.
      # 값 변경 반영은 restart 가 아니라 `docker compose up -d <service>` 재생성(§0).
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
    shm_size: "1gb"
    # ML 훈련 큐 워커 메모리 상한 (설계 2026-07-30 §6.4). #317 의
    # 컨테이너 스코프 격리 완성. 산술: worker_concurrency=2 x
    # worker_max_memory_per_child(자식 3GiB) = 6GiB + 부모/오버헤드 → 8g 로 둬야
    # 자식 리사이클러가 컨테이너 OOM 킬러보다 **먼저** 동작한다(6g 면 자식 2개가
    # 상한까지 차는 순간 여유가 0이라 OOM 킬러가 이긴다).
    # 반영은 `docker compose up -d training-worker` 재생성(§0).
    mem_limit: 8g
    volumes:
      - .:/app
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO --queues=${CELERY_ML_TRAINING_QUEUE:-bid_vector_ml_training}

  beat:
    build:
      context: .
      target: ${API_DOCKER_TARGET:-api-runtime}
    container_name: bid_vector_beat
    restart: unless-stopped
    init: true
    profiles:
      - tasks
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-bid_vector_db}
      DATABASE_USER: ${DATABASE_USER:-biduser}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-bidpassword}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://bidvector:bidvector@rabbitmq:5672/bidvector}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-cache+memory://}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      MODEL_CACHE_DIR: /app/models
      CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY: ${CLASSIFIER_EMBEDDING_LOCAL_FILES_ONLY:-true}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PYTHONPATH: /app
    shm_size: "1gb"
    volumes:
      - .:/app
      - celery_beat_data:/tmp
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

volumes:
  postgres_data:
  rabbitmq_data:
  celery_beat_data:
  frontend_node_modules:
