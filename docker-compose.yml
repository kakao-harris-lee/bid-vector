services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bid_vector_db
    environment:
      POSTGRES_DB: bid_vector_db
      POSTGRES_USER: biduser
      POSTGRES_PASSWORD: bidpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biduser -d bid_vector_db"]
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: bid_vector_api
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://biduser:bidpassword@db:5432/bid_vector_db
    ports:
      - "8000:8000"
    shm_size: "1gb"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
