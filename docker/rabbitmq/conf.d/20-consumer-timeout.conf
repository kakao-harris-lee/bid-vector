# Celery countdown(ETA) 메시지를 위한 consumer_timeout 상향.
#
# 왜 필요한가
#   celery 워커는 ETA 메시지를 브로커에서 받아 **미확인(unacked) 상태로 들고 있다가**
#   ETA 시각에 실행한다(celery/worker/strategy.py 의 qos.increment_eventually 경로).
#   여기에 task_acks_late=true 라서 ack 은 실행이 끝난 뒤에 나간다. 즉 한 메시지의
#   배달~ack 최대 간격은
#       최대 countdown + 실행 hard limit
#     = KONEPS_COLLECTION_LEASE_BUSY_RETRY_DELAY_SECONDS(600s)
#       + CELERY_TASK_TIME_LIMIT_SECONDS(1800s)
#     = 2400s
#   RabbitMQ 3.12 의 기본 consumer_timeout 은 1_800_000ms(30분)라 이 창보다 짧다.
#   초과하면 브로커가 채널을 PRECONDITION_FAILED 로 끊고 메시지를 재큐잉하며,
#   실행 중이던 수집 태스크가 취소된다.
#
# 값 근거
#   2400s 위에 여유를 둬 3_600_000ms(60분). 위 두 설정을 올리면 이 값도 함께 올려야
#   한다(consumer_timeout >= hard_limit + 최대 countdown + 여유).
#
# 왜 conf.d 인가
#   공식 이미지는 RABBITMQ_DEFAULT_USER/PASS/VHOST 로 메인 설정을 생성한다. 메인
#   파일을 덮어쓰면 그 생성물과 충돌하므로, RabbitMQ 가 함께 병합하는 conf.d 에
#   이 항목만 얹는다(10- 접두 기본값 뒤에 오도록 20-).
consumer_timeout = 3600000
