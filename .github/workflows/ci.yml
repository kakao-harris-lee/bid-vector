name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Unit tests are SQLite-isolated (tests/conftest.py) and never touch the
          # ML stack at import time, so the heavy ml-embedding/ml-training wheels
          # (torch/sklearn/pandas) are intentionally NOT installed here.
          pip install -r requirements/runtime.txt -r requirements/dev.txt

      - name: Ruff (lint)
        # 설계 래칫 스캐너는 자신이 검사하는 규율을 지켜야 하므로 lint 대상에 포함한다
        # (scripts/ 전체는 아직 grandfathered — docs/operations/design-ratchet.md).
        run: >-
          ruff check app/ scripts/design_ratchet.py
          scripts/_design_ratchet_scan.py scripts/_design_ratchet_contracts.py

      - name: Mypy (type check — lenient legacy, strict islands)
        run: mypy app/

      - name: Pytest (SQLite-isolated unit tests, no external services)
        # conftest.py forces DATABASE_URL=sqlite, ENVIRONMENT=test, and an
        # in-memory Celery broker, so no secrets or Docker services are required.
        run: pytest -q tests/
