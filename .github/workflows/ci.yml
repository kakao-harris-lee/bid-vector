name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/dev.txt
            requirements/ml-training.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ml-embedding (torch) stays out: nothing here loads an embedding model.
          # ml-training IS installed — the 낙찰률 GBM(Phase 2) guards are exactly the
          # tests that must not silently skip. They fix the out-of-fold encoding
          # scope, the holdout boundary-tie rule, and the guardrail red line; a
          # refactor that undoes any of them fails only if these run. Skipping them
          # for a lean install would leave CI green while the leak came back.
          pip install -r requirements/runtime.txt -r requirements/dev.txt \
            -r requirements/ml-training.txt

      - name: Ruff (lint)
        # 설계 래칫 스캐너는 자신이 검사하는 규율을 지켜야 하므로 lint 대상에 포함한다
        # (scripts/ 전체는 아직 grandfathered — docs/operations/design-ratchet.md).
        run: >-
          ruff check app/ scripts/design_ratchet.py
          scripts/_design_ratchet_scan.py scripts/_design_ratchet_contracts.py
          scripts/_design_ratchet_clones.py

      - name: Mypy (type check — lenient legacy, strict islands)
        run: mypy app/

      - name: Pytest (SQLite-isolated unit tests, no external services)
        # The root conftest.py forces DATABASE_URL=sqlite, ENVIRONMENT=test, and
        # an in-memory Celery broker, so no secrets or Docker services are needed.
        # `postgres`-marked tests skip here (TEST_POSTGRES_URL is unset); they run
        # in the `postgres` job below.
        run: pytest -q tests/

  postgres:
    name: postgres tier (pgvector dialect contracts)
    runs-on: ubuntu-latest
    # The SQLite suite cannot see PostgreSQL-only contracts: json columns have no
    # equality operator (#212 escaped to production), pgvector VECTOR(384) has no
    # SQLite equivalent, and row-lock claim semantics differ. This job runs the
    # handful of `postgres`-marked tests against the production image.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        # Throwaway CI-only credentials for an ephemeral service container --
        # not a secret, and unreachable outside this job.
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same lean install as the quality job: the postgres tier exercises
          # dialect/schema contracts, never the ML stack.
          pip install -r requirements/runtime.txt -r requirements/dev.txt

      - name: Pytest (postgres tier)
        env:
          TEST_POSTGRES_URL: postgresql://test:test@localhost:5432/test
          # Without this, a broken connection string would skip every test and
          # still report success.
          REQUIRE_POSTGRES_TIER: "1"
        run: pytest -m postgres -q
